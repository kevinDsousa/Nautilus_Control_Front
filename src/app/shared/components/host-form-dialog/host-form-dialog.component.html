<form [formGroup]="form" class="flex flex-column gap-3 p-2" (ngSubmit)="salvar()">

    <div class="flex flex-column gap-2">
        <label for="name">Nome</label>
        <input id="name" type="text" pInputText formControlName="name" placeholder="Ex.: Servidor de Produção" />
    </div>

    <div class="flex flex-column gap-2">
        <label for="description">Descrição (opcional)</label>
        <input id="description" type="text" pInputText formControlName="description" placeholder="Ex.: VPS da Hetzner" />
    </div>

    <div class="flex flex-column gap-2">
        <label for="dockerHost">Endereço do Docker Engine</label>
        <input id="dockerHost" type="text" pInputText formControlName="dockerHost"
               placeholder="unix:///var/run/docker.sock ou tcp://192.168.1.10:2376" />
    </div>

    <div class="flex flex-column gap-2" *ngIf="folders.length > 0">
        <label for="folderId">Pasta (opcional)</label>
        <p-dropdown id="folderId" formControlName="folderId" [options]="folders" optionLabel="name"
                    optionValue="id" [showClear]="true" placeholder="Raiz"></p-dropdown>
    </div>

    <div class="flex align-items-center gap-2">
        <p-inputSwitch formControlName="tlsEnabled"></p-inputSwitch>
        <label>Conexão remota via TCP + TLS</label>
    </div>

    <div class="flex flex-column gap-3" *ngIf="form.get('tlsEnabled')?.value">
        <small *ngIf="isEdicao" class="text-color-secondary">
            Por segurança os certificados não são reexibidos aqui. Deixe os campos em branco para manter os atuais, ou cole novos valores para substituí-los.
        </small>
        <div class="flex flex-column gap-2">
            <label for="caCert">CA Certificate (ca.pem)</label>
            <textarea id="caCert" pInputTextarea rows="3" formControlName="caCert"></textarea>
        </div>
        <div class="flex flex-column gap-2">
            <label for="clientCert">Client Certificate (cert.pem)</label>
            <textarea id="clientCert" pInputTextarea rows="3" formControlName="clientCert"></textarea>
        </div>
        <div class="flex flex-column gap-2">
            <label for="clientKey">Client Key (key.pem)</label>
            <textarea id="clientKey" pInputTextarea rows="3" formControlName="clientKey"></textarea>
        </div>
    </div>

    <div class="flex align-items-center gap-2" *ngIf="resultadoTeste">
        <span *ngIf="resultadoTeste === 'sucesso'" class="text-green-600">Conexão bem-sucedida.</span>
        <span *ngIf="resultadoTeste === 'falha'" class="text-red-600">Não foi possível conectar a este host.</span>
    </div>

    <div class="flex justify-content-between gap-2 mt-2">
        <button pButton type="button" label="Testar conexão" [loading]="testando" (click)="testarConexao()" class="p-button-outlined"></button>
        <div class="flex gap-2">
            <button pButton type="button" label="Cancelar" class="p-button-text" (click)="cancelar()"></button>
            <button pButton type="submit" label="Salvar" [loading]="salvando"></button>
        </div>
    </div>
</form>
