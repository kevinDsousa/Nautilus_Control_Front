<p-button icon="pi pi-bars" label="Menu" (click)="toggleSidebar()"></p-button>

<p-sidebar [(visible)]="visible" position="left" styleClass="nautilus-sidebar">
    <h2>Menu</h2>
    <ul>
        <li *ngFor="let item of menuItems">
            <a [routerLink]="item.route">{{ item.label }}</a>
        </li>
    </ul>

    <div class="flex align-items-center justify-content-between mt-4 mb-2">
        <h2 class="m-0">Hosts Docker</h2>
        <span class="flex gap-1">
            <button pButton type="button" icon="pi pi-folder-plus" class="p-button-text p-button-sm" pTooltip="Nova pasta" (click)="novaPastaRaiz()"></button>
            <button pButton type="button" icon="pi pi-plus" class="p-button-text p-button-sm" pTooltip="Novo host" (click)="novoHostRaiz()"></button>
        </span>
    </div>

    <small class="block mb-2 text-color-secondary">Arraste um host ou pasta sobre outra pasta para movê-lo para dentro dela.</small>

    <p-tree [value]="treeNodes" selectionMode="single" (onNodeSelect)="onNodeSelect($event)" styleClass="host-tree"
            [draggableNodes]="true" [droppableNodes]="true" (onNodeDrop)="onNodeDrop($event)">
        <ng-template let-node pTemplate="default">
            <div class="flex align-items-center justify-content-between w-full host-tree-node"
                 [class.active-host]="isActiveHostNode(node)">
                <span>{{ node.label }}</span>
                <span class="node-actions flex gap-1">
                    <button *ngIf="node.data?.type === 'folder'" pButton type="button" icon="pi pi-folder-plus" class="p-button-text p-button-sm" pTooltip="Nova subpasta" (click)="novaSubpasta(node, $event)"></button>
                    <button *ngIf="node.data?.type === 'folder'" pButton type="button" icon="pi pi-plus" class="p-button-text p-button-sm" pTooltip="Novo host aqui" (click)="novoHostEmPasta(node, $event)"></button>
                    <button *ngIf="node.data?.type === 'host'" pButton type="button" icon="pi pi-bolt" class="p-button-text p-button-sm" pTooltip="Testar conexão" (click)="testarConexaoNode(node, $event)"></button>
                    <button *ngIf="estaDentroDeUmaPasta(node)" pButton type="button" icon="pi pi-arrow-up" class="p-button-text p-button-sm" pTooltip="Mover para a raiz" (click)="moverParaRaiz(node, $event)"></button>
                    <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" (click)="editarNode(node, $event)"></button>
                    <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" pTooltip="Excluir" (click)="excluirNode(node, $event)"></button>
                </span>
            </div>
        </ng-template>
    </p-tree>

    <div class="mt-3" *ngIf="ultimoTeste">
        <span *ngIf="ultimoTeste.ok" class="text-green-600">{{ ultimoTeste.nome }}: conexão bem-sucedida.</span>
        <span *ngIf="!ultimoTeste.ok" class="text-red-600">{{ ultimoTeste.nome }}: falha ao conectar.</span>
    </div>
</p-sidebar>
