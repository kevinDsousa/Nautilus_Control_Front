<form [formGroup]="form" class="flex flex-column gap-3 p-2" (ngSubmit)="salvar()">

    <div class="flex flex-column gap-2">
        <label for="name">Nome da pasta</label>
        <input id="name" type="text" pInputText formControlName="name" placeholder="Ex.: Produção" />
    </div>

    <div class="flex flex-column gap-2" *ngIf="folders.length > 0">
        <label for="parentId">Pasta pai (opcional)</label>
        <p-dropdown id="parentId" formControlName="parentId" [options]="folders" optionLabel="name"
                    optionValue="id" [showClear]="true" placeholder="Raiz"></p-dropdown>
    </div>

    <div class="flex justify-content-end gap-2 mt-2">
        <button pButton type="button" label="Cancelar" class="p-button-text" (click)="cancelar()"></button>
        <button pButton type="submit" label="Salvar" [loading]="salvando"></button>
    </div>
</form>
